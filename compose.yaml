services:
  brickts:
    build: .
    ports:
      - "8000:8080"
    environment:
      BRICKTS_DB_PATH: /app/var/timeseries.sqlite
      BRICKTS_BOOTSTRAP_ON_STARTUP: "true"
    volumes:
      - brickts-var:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  brickts-var:
