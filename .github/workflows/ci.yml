name: ci

on:
  push:
    branches: [develop, feature/*]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run bldgts model build
      - run: uv run pytest -q

  lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run bldgts model build
      - run: uv run bldgts bootstrap
      - name: Run every SQL block in the lessons and check the expected answers
        run: uv run python lessons/course.py check
