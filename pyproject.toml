[project]
name = "bldgts"
version = "0.1.0"
description = "Building model + timeseries SPARQL API (ontology-agnostic; Haystack UI; SQLite stand-in historian)"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "brickschema>=0.8,<0.9",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "open-fdd[oracle]>=4.4.9,<5",
    "pandas>=2.2,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-multipart>=0.0.9",
    "rdflib>=7.1,<8",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
bldgts = "bldgts.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

# Live app base = Part 2 checkpoint (no repo-root src/). Future parts freeze their own trees.
[tool.uv.build-backend]
module-name = "bldgts"
module-root = "blog/if-the-analyst-could-create-an-api/part-02-model-crud-ui/checkpoint/src"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "blog/if-the-analyst-could-create-an-api/part-01-bare-sparql-api/checkpoint",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
