[project]
name = "brickts"
version = "0.1.0"
description = "Brick timeseries SPARQL tutorial — SQLite TSDB stand-in + read-only SPARQL API"
requires-python = ">=3.12"
dependencies = [
    "brickschema>=0.8,<0.9",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "open-fdd[oracle]>=4.4.9,<5",
    "pandas>=2.2,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "rdflib>=7.1,<8",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
brickts = "brickts.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
